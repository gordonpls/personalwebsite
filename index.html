<!doctype html>
<html lang="en">
  <head>
    <!-- public/index.html -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta/dist/vanta.waves.min.js"></script>

    <meta charset="UTF-8" />
    <link rel="icon" href="/public/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G. Zhong</title>
    <!-- Set the theme before first paint to avoid a flash. Everyone starts on
         dark (business, or a /theme-demo session preview); "light" is only used
         if chosen under the current key
         (theme-v2 — the old "theme" key is dropped so returning visitors reset).
         Mirrors src/lib/theme.ts. -->
    <script>
      try {
        localStorage.removeItem("theme");
        var light = localStorage.getItem("theme-v2") === "light";
        document.documentElement.setAttribute(
          "data-theme",
          light ? "corporate" : sessionStorage.getItem("theme-preview") || "business"
        );
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "business");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
