<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- three.js for the Hero's Vanta clouds (imported from npm in Hero.tsx).
         `defer`: downloads in parallel without blocking first paint, and still
         runs before the app's module script below (deferred scripts execute in
         document order), so window.THREE is ready when Hero mounts. -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <link rel="icon" href="/favicon.ico" />
    <!-- Brush face for the Hero's Chinese greeting, subset to just its characters (tiny). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: the brush face is only needed seconds in (Chinese greeting),
         so load the stylesheet as print-only and switch it on once it arrives. -->
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&text=%E4%BD%A0%E5%A5%BD%EF%BC%8C%E6%88%91%E7%9A%84%E5%90%8D%E5%AD%97%E6%98%AF%3A&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G. Zhong</title>
    <!-- Set the theme before first paint to avoid a flash. Everyone starts on
         dark (business); "light" is only used if chosen under the current key
         (theme-v2 — the old "theme" key is dropped so returning visitors reset).
         Mirrors src/lib/theme.ts. -->
    <script>
      try {
        localStorage.removeItem("theme");
        var light = localStorage.getItem("theme-v2") === "light";
        document.documentElement.setAttribute(
          "data-theme",
          light ? "corporate" : "business"
        );
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "business");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
