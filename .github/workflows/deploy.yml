name: Build & Deploy

# Replaces the old cPanel git-push deploy (.cpanel.yml). Builds the frontend
# in CI and ships the built output to cPanel over SSH/rsync, so dist/ no longer
# needs to live in git.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a deploy manually from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  # These were already public in .cpanel.yml, so they're not secrets.
  SSH_HOST: gordonzhong.com          # if SSH refuses, try your server hostname/IP from cPanel
  SSH_USER: fmaovpetmf
  SSH_PORT: "21098"                  # Namecheap shared hosting uses 21098 (not 22) — verify in cPanel → SSH Access
  WEB_ROOT: /home/fmaovpetmf/gordonzhong.com/
  SERVER_ROOT: /home/fmaovpetmf/server/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Gate 1: block the deploy if any secret is committed. Runs before deps are
      # installed so node_modules isn't scanned; --no-git scans the working tree.
      - name: Secret scan (gitleaks)
        run: |
          VER=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.tag_name | ltrimstr("v")')
          echo "gitleaks v$VER"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-git --redact --no-banner --verbose

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate 2: block the deploy on lint errors.
      - name: Lint
        run: npm run lint

      - name: Build frontend
        # VITE_ vars are baked into the client bundle at build time. They're
        # exposed in the browser anyway, but kept as secrets to avoid committing.
        run: npm run build
        env:
          VITE_ALPHAVANTAGE_KEY: ${{ secrets.VITE_ALPHAVANTAGE_KEY }}
          VITE_WEATHER_API_KEY: ${{ secrets.VITE_WEATHER_API_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          # strip any CR (CRLF) the secret may carry, and ensure a trailing newline
          printf '%s\n' "$CPANEL_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # fail early with a clear message if the secret isn't a valid private key
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::CPANEL_SSH_KEY is not a valid private key. Re-set it with: gh secret set CPANEL_SSH_KEY < ~/.ssh/cpanel_deploy"
            exit 1
          fi
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}

      # Frontend: mirror dist/ into the web root (the built .htaccess ships with it).
      # Exclude api/ so --delete never removes the cPanel Node-app Passenger mount
      # (cPanel creates ~/gordonzhong.com/api/.htaccess to route /api to Express).
      # Protect assets/ from --delete: hashed chunks are immutable, so KEEPING old
      # ones means a tab loaded before this deploy can still lazy-load its chunks
      # instead of 404'ing into index.html (the "Failed to load module script /
      # MIME text/html" error). New build's index.html points at the new hashes;
      # stale assets just linger harmlessly until a periodic cleanup.
      - name: Deploy frontend
        run: |
          rsync -az --delete --exclude 'api' --filter='protect assets/**' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            dist/ "$SSH_USER@$SSH_HOST:$WEB_ROOT"

      # Backend: same excludes as the old .cpanel.yml — never overwrite the
      # server's .env, .htaccess, or installed node_modules. Also keep the
      # runtime Spotify last-played cache (gitignored, so absent from CI) — without
      # this exclude, --delete would wipe it on every deploy and the now-playing
      # bar would go empty until a track resolves live again.
      - name: Deploy backend
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .env --exclude .htaccess \
            --exclude .plaid-items.json \
            --exclude spotify-last.json --exclude spotify-tokens.json \
            --exclude spotify-needs-reauth.flag \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            server/ "$SSH_USER@$SSH_HOST:$SERVER_ROOT"

      # Install backend deps (no-op when unchanged) and restart the Passenger app.
      # cPanel runs Node inside a virtualenv (nodevenv); source it if present so
      # the right npm is used. Adjust the path if your app root isn't "server".
      - name: Install backend deps & restart Passenger
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<'EOSSH'
          set -e
          cd ~/server
          ACT="$(ls ~/nodevenv/server/*/bin/activate 2>/dev/null | head -n1 || true)"
          if [ -n "$ACT" ]; then . "$ACT"; fi
          npm install --omit=dev
          mkdir -p tmp && touch tmp/restart.txt
          EOSSH
