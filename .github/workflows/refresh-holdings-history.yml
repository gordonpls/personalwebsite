name: Refresh holdings price history

# Re-bakes server/data/holdingsHistory.json (performance chart prices) and
# server/data/holdingsMeta.json (per-holding metadata) on a schedule so they never go
# stale and pick up newly-bought tickers — no local machine or manual step needed.
# Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: "0 8 * * 6"   # Saturdays 08:00 UTC (after the week's closes)
  workflow_dispatch: {}

permissions:
  contents: write          # to commit the refreshed file back to the repo

concurrency:
  group: refresh-holdings
  cancel-in-progress: false

env:
  SSH_HOST: gordonzhong.com
  SSH_USER: fmaovpetmf
  SSH_PORT: "21098"
  SERVER_DATA: /home/fmaovpetmf/server/data/

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Pulls the live ticker list from prod /api/holdings, then fetches each
      # ticker's dividend-adjusted daily history + metadata from Yahoo (no key),
      # enriched with Finnhub company profiles for stocks.
      - name: Bake holdings price history + metadata
        run: node scripts/fetch-holdings-history.mjs
        env:
          HOLDINGS_URL: https://gordonzhong.com/api/holdings
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINANCE_PASSWORD: ${{ secrets.FINANCE_PASSWORD }}   # /api/holdings is password-gated

      - name: Detect change
        id: diff
        run: git diff --quiet -- server/data/holdingsHistory.json server/data/holdingsMeta.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      # Keep the repo in sync so the next normal deploy doesn't ship stale files.
      - name: Commit refreshed files
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/data/holdingsHistory.json server/data/holdingsMeta.json
          git commit -m "chore: refresh holdings price history + metadata (scheduled)"
          git push

      # Push just the data files to the backend (served password-gated by
      # /api/finance/*; read per request, so no rebuild or restart needed).
      - name: Deploy refreshed files
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" server/data/holdingsHistory.json server/data/holdingsMeta.json "$SSH_USER@$SSH_HOST:$SERVER_DATA"
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
